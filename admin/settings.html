<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>BYE BYE · Editor visual</title><link rel="stylesheet" href="admin.css?v=20261112"><link rel="stylesheet" href="settings.css?v=20261112-visual-editor"><link rel="stylesheet" href="settings-sortable.css?v=20261112"><link rel="stylesheet" href="settings-layout-fix.css?v=20261113-viewport-1"></head>
<body class="visual-editor-page">
<div id="notice" role="status" aria-live="polite"></div>
<section id="locked" class="locked-card" hidden><h1>Ingresá primero</h1><p>Para editar el diseño necesitás iniciar sesión en Administración.</p><a class="button primary" href="./">Ir a Administración</a></section>
<section id="studio" class="editor-app" hidden>
  <header class="editor-topbar">
    <a href="./" class="editor-brand" aria-label="Volver a productos">BYE BYE <span>EDITOR VISUAL</span></a>
    <div class="document-state"><strong id="draft-state">Cargando…</strong><span id="published-state"></span></div>
    <div class="editor-actions"><button id="undo" title="Deshacer" disabled>Deshacer</button><button id="redo" title="Rehacer" disabled>Rehacer</button><button id="save-draft">Guardar</button><button id="preview">Vista previa ↗</button><button id="publish" class="primary">Publicar</button><button id="more-menu" class="icon-action" aria-label="Más opciones" title="Más opciones">•••</button></div>
    <div id="more-popover" class="more-popover" hidden><button id="export-json">Exportar copia JSON</button><button id="import-json">Importar JSON</button><button id="open-history">Historial de publicaciones</button><a href="../manual/" target="_blank">Abrir manual ↗</a><input id="import-file" type="file" accept="application/json,.json" hidden></div>
  </header>
  <div class="editor-subbar">
    <button id="page-menu" class="page-button">Página <strong>Catálogo</strong>⌄</button>
    <div class="device-switch" aria-label="Dispositivo de vista previa"><button data-device="desktop" class="active">Computadora</button><button data-device="mobile">Celular</button></div>
    <label class="settings-search">⌕ <input id="settings-search" type="search" placeholder="¿Qué querés cambiar?"></label>
  </div>
  <div class="editor-body">
    <nav class="tool-rail" aria-label="Herramientas del editor">
      <button data-layer="add" title="Agregar sección"><span>＋</span><small>Agregar</small></button><button data-layer="layers" title="Capas"><span>☷</span><small>Capas</small></button><button data-layer="theme" title="Tema y estilos"><span>◐</span><small>Estilo</small></button><button data-layer="header" title="Encabezado"><span>▤</span><small>Encabezado</small></button><button data-layer="hero" title="Flyers"><span>▧</span><small>Flyers</small></button><button data-layer="products" title="Productos y grilla"><span>▦</span><small>Prendas</small></button><button data-layer="categories" title="Categorías"><span>▥</span><small>Categorías</small></button><button data-layer="order" title="Orden de productos"><span>↕</span><small>Orden</small></button><button data-layer="functions" title="Funciones"><span>✣</span><small>Funciones</small></button><button data-layer="images" title="Imágenes"><span>▣</span><small>Imágenes</small></button><button data-layer="text" title="Todos los textos"><span>A</span><small>Textos</small></button><button data-layer="seo" title="SEO y compartir"><span>⌁</span><small>Google</small></button><button data-layer="history" title="Historial"><span>◴</span><small>Historial</small></button>
    </nav>
    <aside id="editor-panel" class="editor-panel sheet-half" aria-label="Panel de edición"><button id="sheet-handle" class="sheet-handle" aria-label="Cambiar altura del panel"><span></span></button><div class="panel-heading"><div><span id="panel-kicker">EDICIÓN VISUAL</span><nav id="selection-path" class="selection-path" aria-label="Ruta del elemento"></nav><h2 id="panel-title">Capas</h2></div><button id="close-panel" aria-label="Cerrar panel">×</button></div><div id="panel-content" class="panel-content"></div></aside>
    <main class="canvas-area"><div id="canvas-stage" class="canvas-stage"><div id="canvas-frame" class="canvas-frame device-desktop"><iframe id="live-preview" title="Vista previa editable del catálogo" src="../?site-preview=1&amp;editor=1"></iframe></div></div><div id="hover-label" class="hover-label" hidden></div><div id="selection-toolbar" class="selection-toolbar" hidden><strong id="selection-label">Elemento</strong><button id="quick-edit">Editar</button><button id="hide-selected" hidden>Ocultar</button></div><div id="canvas-help" class="canvas-help"><span>Tocá cualquier parte del catálogo para editarla. Hacé doble clic sobre un texto para escribir directamente.</span><button id="close-help" aria-label="Cerrar ayuda">×</button></div></main>
  </div>
  <nav class="mobile-actions" aria-label="Acciones del editor"><button data-mobile-action="add">Agregar</button><button data-mobile-action="edit">Editar</button><button data-mobile-action="layers">Capas</button><button data-mobile-action="publish">Publicar</button></nav>
</section>
<script src="../catalog-config.js?v=20261110"></script><script src="../catalog-api.js?v=20261113-save-product-fix"></script><script src="../catalog-site-schema.js?v=20261112-v2"></script><script src="image-optimizer.js?v=20261008"></script><script src="settings.js?v=20261113-elements-1"></script>
</body></html>
